<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HTML Form Example</title>
<style>
    body {
    
    background-image: url('Screenshot(99).jpg');
    
    background-attachment: fixed;
    
    }
    

    h1 {
            color: #d32020;
        }


    div {
    
    margin-top: 10px;
    
    margin-right: 20px;
    
    margin-bottom: 10px;
    
    margin-left: 20px;
    
    }
    </style>
     
    
</head>

<body>

<h2>Registration Form</h2>

<form action="" method="">

 

<!-- Text Input -->

<label for="fname">First Name:</label><br>

<input type="text" id="fname" name="firstname" placeholder="John" required><br><br>

 

<!-- Password Input -->

<label for="pwd">Password:</label><br>

<input type="password" id="pwd" name="password" required><br><br>

 

<!-- Email Input -->

<label for="email">Email:</label><br>

<input type="email" id="email" name="email" placeholder="john@example.com" required><br><br>

 

<!-- Telephone Input -->

<label for="phone">Phone:</label><br>

<input type="tel" id="phone" name="phone" placeholder="123-456-7890"><br><br>

 

<!-- URL Input -->

<label for="website">Website:</label><br>

<input type="url" id="website" name="website" placeholder="https://example.com"><br><br>

 

<!-- Number Input -->

<label for="age">Age:</label><br>

<input type="number" id="age" name="age" min="1" max="100"><br><br>

 

<!-- Date Input -->

<label for="dob">Date of Birth:</label><br>

<input type="date" id="dob" name="dob"><br><br>

 

<!-- Radio Buttons -->

<label>Gender:</label><br>

<input type="radio" id="male" name="gender" value="male">

<label for="male">Male</label><br>

<input type="radio" id="female" name="gender" value="female">

<label for="female">Female</label><br><br>

 

<!-- Checkboxes -->

<label>Interests:</label><br>

<input type="checkbox" id="sports" name="interests" value="sports">

<label for="sports">Sports</label><br>

<input type="checkbox" id="music" name="interests" value="music">

<label for="music">Music</label><br>

<input type="checkbox" id="reading" name="interests" value="reading">

<label for="reading">Reading</label><br><br>

 

<!-- Dropdown Select -->

<label for="country">Country:</label><br>

<select id="country" name="country">

<option value="usa">United States</option>

<option value="canada">Canada</option>

<option value="uk">United Kingdom</option>

</select><br><br>

 

<!-- Textarea -->

<label for="bio">Bio:</label><br>

<textarea id="bio" name="bio" rows="4" cols="50" placeholder="Tell us something about yourself..."></textarea><br><br>

 

<!-- File Upload -->

<label for="resume">Upload Resume:</label><br>

<input type="file" id="resume" name="resume"><br><br>

 

<!-- Submit Button -->

<input type="submit" value="Register">

 

</form>

 

</body>

</html>
